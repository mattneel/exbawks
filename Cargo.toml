[workspace]
resolver = "2"
members = [
    "apps/exbawks-cli",
    "crates/exbawks-core",
    "crates/exbawks-cpu",
    "crates/exbawks-debug",
    "crates/exbawks-gpu",
    "crates/exbawks-jit",
    "crates/exbawks-kernel",
    "crates/exbawks-memory",
    "crates/exbawks-platform",
    "crates/exbawks-types",
    "crates/exbawks-xbe",
    "xtask",
]
default-members = ["apps/exbawks-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
bitflags = { version = "2", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
iced-x86 = "1.21"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

exbawks-core = { path = "crates/exbawks-core" }
exbawks-cpu = { path = "crates/exbawks-cpu" }
exbawks-debug = { path = "crates/exbawks-debug" }
exbawks-gpu = { path = "crates/exbawks-gpu" }
exbawks-jit = { path = "crates/exbawks-jit" }
exbawks-kernel = { path = "crates/exbawks-kernel" }
exbawks-memory = { path = "crates/exbawks-memory" }
exbawks-platform = { path = "crates/exbawks-platform" }
exbawks-types = { path = "crates/exbawks-types" }
exbawks-xbe = { path = "crates/exbawks-xbe" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
todo = "warn"
unimplemented = "warn"
unwrap_used = "allow"
